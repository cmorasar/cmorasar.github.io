name: Build

# Mirrors the build GitHub Pages runs when master is pushed, so a red check
# here means the real deploy would have failed too. It verifies that the site
# compiles — not that the pages render correctly.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production # what GitHub Pages sets; enables HTML compression
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace
