<script>
  // Theme toggle. Delegated from the document so it does not depend on script
  // order. Writing data-theme pins the choice; the media query in _tokens.scss
  // continues to govern anyone who never clicks.
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".theme-toggle");
    if (!button) return;

    var root = document.documentElement;
    var pinned = root.getAttribute("data-theme");
    var current = pinned || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";

    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
</script>
