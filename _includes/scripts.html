<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  /* compress_html strips newlines in production, so a line comment would run on
     and swallow everything after it. Block comments only in here. */
  /* Delegated so it does not depend on script order. Writing data-theme pins
     the choice; the media query still governs anyone who never clicks. */
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".theme-toggle");
    if (!button) return;

    var root = document.documentElement;
    var pinned = root.getAttribute("data-theme");
    var current = pinned || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";

    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
</script>
