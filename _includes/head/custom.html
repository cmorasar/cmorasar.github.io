{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ base_path }}/images/favicon-96.png" sizes="96x96" type="image/png"> <!-- Safari 16 and older -->
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Apply a saved theme choice before first paint, so the page never flashes
     the wrong palette. Absence of the key means follow the operating system. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {}
  })();
</script>

<!-- MathJax -->
{% if page.mathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
